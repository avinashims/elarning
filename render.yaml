databases:
  - name: elearning-db
    databaseName: elearning
    user: elearning
    plan: free

services:
  - type: web
    name: elearning-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elearning-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: VIDEO_SIGNING_SECRET
        generateValue: true
      - key: REDIS_URL
        value: ""
