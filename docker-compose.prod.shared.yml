services:
  redis:
    image: redis:7-alpine
    container_name: elearning-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elearning-api
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '0.0.0.0:${APP_PORT:-9001}:${APP_PORT:-9001}'
    volumes:
      - video_data:/app/videos
    depends_on:
      - redis
    networks:
      - default
      - hotelbooking_default

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: elearning-web
    restart: unless-stopped
    ports:
      - '0.0.0.0:${WEB_PORT:-9002}:80'
    depends_on:
      - api
    networks:
      - default

networks:
  hotelbooking_default:
    external: true

volumes:
  redis_data:
  video_data:
