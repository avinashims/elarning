services:
  redis:
    image: redis:7-alpine
    container_name: elearning-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elearning-api
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${APP_PORT:-9001}:${APP_PORT:-9001}'
    volumes:
      - video_data:/app/videos
    depends_on:
      - redis

volumes:
  redis_data:
  video_data:
