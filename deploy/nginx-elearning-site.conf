# Optional: host nginx in front of Docker (single public URL on port 80)
# Replace YOUR_DROPLET_IP or your domain in server_name.
#
# Install:
#   cp deploy/nginx-elearning-site.conf /etc/nginx/sites-available/elearning
#   ln -sf /etc/nginx/sites-available/elearning /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DROPLET_IP learn.yourdomain.com;

    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
